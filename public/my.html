<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>ประวัติการชำระเงินของฉัน — โรงเรียนจุนวิทยาคม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
</head>
<body>

<header class="site-header no-print">
  <div class="wrap row-between">
    <a class="brand" href="/" style="text-decoration:none">
      <span class="brand-logo" id="brandLogo">🏫</span>
      <span class="brand-text">
        <span class="brand-title" id="schoolName">โรงเรียนจุนวิทยาคม</span>
        <span class="brand-sub">ระบบแจ้งชำระเงินตามวัตถุประสงค์การจัดเก็บ</span>
      </span>
    </a>
    <nav class="nav">
      <a href="/">รายการชำระเงิน</a>
      <a href="/check.html">ตรวจสอบสลิป</a>
      <a href="/my.html" class="active">ประวัติของฉัน</a>
    </nav>
  </div>
</header>

<main class="wrap" style="padding-block:1.5rem 2rem;max-width:960px">
  <div class="stack">
    <section class="card no-print" id="loginCard" style="max-width:520px;margin-inline:auto">
      <h1 style="margin-bottom:.25rem">ประวัติการชำระเงินของฉัน</h1>
      <p class="muted small" style="margin-bottom:1rem">
        กรอกรหัสสมาชิกและรหัส PIN เพื่อดูรายการที่ต้องชำระและประวัติการชำระทั้งหมดของท่าน
      </p>
      <form id="myForm" autocomplete="off">
        <div class="field">
          <label class="req" for="codeInput">รหัสสมาชิก</label>
          <input type="text" id="codeInput" required maxlength="40" placeholder="เช่น M0001" autocomplete="username">
        </div>
        <div class="field" id="pinField">
          <label class="req" for="pinInput">รหัส PIN</label>
          <input type="password" id="pinInput" inputmode="numeric" maxlength="12" placeholder="••••••" autocomplete="current-password">
          <div class="hint">หากลืมรหัส PIN กรุณาติดต่อฝ่ายการเงินของโรงเรียนเพื่อขอรหัสใหม่</div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="myBtn">ดูประวัติของฉัน</button>
      </form>
    </section>

    <div id="result"></div>
  </div>
</main>

<footer class="site-footer no-print"><div class="wrap"><p id="contactNote" style="margin:0"></p><p style="margin:.35rem 0 0" class="tiny footer-actions"><a class="btn btn-ghost btn-sm staff-link" href="/admin" title="เข้าสู่ระบบผู้ดูแล (สำหรับเจ้าหน้าที่ของโรงเรียนเท่านั้น)">🔐 สำหรับเจ้าหน้าที่</a></p></div></footer>

<script src="/js/common.js"></script>
<script src="/js/public-my.js"></script>
</body>
</html>
