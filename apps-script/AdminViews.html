/** กราฟแท่ง SVG อย่างง่าย (ไม่ต้องพึ่งไลบรารีภายนอก) */
function barChart(trend) {
  var W = 760, H = 240, padL = 62, padR = 12, padT = 16, padB = 42;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var max = 1;
  trend.forEach(function (t) { max = Math.max(max, Number(t.total) || 0); });
  var niceMax = Math.ceil(max / 1000) * 1000 || max;
  var step = innerW / trend.length;
  var bw = Math.min(56, step * 0.62);
  var ns = 'http://www.w3.org/2000/svg';

  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('class', 'chart');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'กราฟยอดรับชำระรายเดือน');

  function mk(tag, attrs, text) {
    var n = document.createElementNS(ns, tag);
    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    return n;
  }

  for (var i = 0; i <= 4; i++) {
    var y = padT + (innerH / 4) * i;
    svg.appendChild(mk('line', { x1: padL, y1: y, x2: W - padR, y2: y, class: 'grid-line' }));
    svg.appendChild(mk('text', { x: padL - 8, y: y + 4, 'text-anchor': 'end' }, money(niceMax - (niceMax / 4) * i, 0)));
  }

  trend.forEach(function (t, i2) {
    var val = Number(t.total) || 0;
    var h = Math.max(2, (val / niceMax) * innerH);
    var x = padL + step * i2 + (step - bw) / 2;
    var y2 = padT + innerH - h;
    var bar = mk('rect', { x: x, y: y2, width: bw, height: h, rx: 4, class: 'bar' });
    bar.appendChild(mk('title', {}, monthLabel(t.ym) + ': ' + money(val) + ' บาท (' + t.cnt + ' รายการ)'));
    svg.appendChild(bar);
    svg.appendChild(mk('text', { x: x + bw / 2, y: H - padB + 18, 'text-anchor': 'middle' }, monthLabel(t.ym)));
  });
  return svg;
}

function monthLabel(ym) {
  var parts = String(ym).split('-');
  var y = Number(parts[0]), m = Number(parts[1]);
  return TH_MONTHS_SHORT[(m || 1) - 1] + ' ' + String((y + 543) % 100);
}

/* ============================ ตรวจสอบการชำระเงิน ============================ */
var payFilters = { status: 'pending', collection: '', group: '', q: '', page: 1 };

route('payments', function (view, params) {
  if (params && params.id) return renderPaymentDetail(view, params.id);

  view.innerHTML = '';
  view.appendChild(pageHead('ตรวจสอบการชำระเงิน', 'ตรวจสอบสลิปที่สมาชิกแจ้งเข้ามา แล้วยืนยันหรือปฏิเสธการชำระ', [
    canWrite() ? el('button', { class: 'btn btn-primary btn-sm', type: 'button', text: '+ บันทึกชำระเงินสด', onclick: openManualPayment }) : null,
    el('button', { class: 'btn btn-sm', type: 'button', text: '🔄 รีเฟรช', onclick: reload })
  ]));
  var card = el('section', { class: 'card card-pad-0' }, [
    el('div', { id: 'payFilters' }), el('div', { id: 'payList' })
  ]);
  view.appendChild(card);
  return loadPayments();
});

function loadPayments() {
  var list = $('#payList');
  if (!list) return Promise.resolve();
  list.innerHTML = '<div class="loading"><span class="spinner"></span> กำลังโหลด...</div>';

  return Promise.all([
    call('apiPayments', payFilters),
    call('apiCollections', {}),
    call('apiGroups', {})
  ]).then(function (res) {
    var data = res[0];
    ADMIN.pendingCount = data.counts.pending;
    buildNav();
    renderPayFilters(res[1].collections, res[2].groups, data.counts);

    list.innerHTML = '';
    if (!data.payments.length) {
      list.appendChild(emptyState('🧾', 'ไม่พบรายการแจ้งชำระ',
        payFilters.status === 'pending' ? 'ไม่มีรายการที่รอการตรวจสอบในขณะนี้' : 'ลองปรับตัวกรองการค้นหา'));
      return;
    }

    var selected = {};
    var bulkBar = el('div', { class: 'hidden', id: 'bulkBar', style: 'padding:.7rem 1.1rem;background:var(--brand-50);border-bottom:1px solid var(--brand-200)' });
    list.appendChild(bulkBar);

    function countSel() { return Object.keys(selected).length; }
    function updateBulk() {
      var n = countSel();
      if (!n) { bulkBar.className = 'hidden'; return; }
      bulkBar.className = 'row-between';
      bulkBar.innerHTML = '';
      bulkBar.appendChild(el('span', { class: 'bold small', text: 'เลือกไว้ ' + n + ' รายการ' }));
      bulkBar.appendChild(el('div', { class: 'row', style: 'gap:.4rem' }, [
        el('button', { class: 'btn btn-sm', type: 'button', text: 'ยกเลิกการเลือก', onclick: function () {
          selected = {};
          $$('.row-check', list).forEach(function (cb) { cb.checked = false; cb.closest('tr').classList.remove('is-selected'); });
          updateBulk();
        }}),
        canWrite() ? el('button', { class: 'btn btn-sm btn-green', type: 'button', text: '✓ อนุมัติทั้งหมด (' + n + ')', onclick: function () {
          bulkApprove(Object.keys(selected).map(Number));
        }}) : null
      ]));
    }

    var tbody = el('tbody');
    data.payments.forEach(function (p) {
      var cb = el('input', { type: 'checkbox', class: 'row-check', value: String(p.id), onchange: function (e) {
        if (e.target.checked) selected[p.id] = true; else delete selected[p.id];
        e.target.closest('tr').classList.toggle('is-selected', e.target.checked);
        updateBulk();
      }});
      tbody.appendChild(el('tr', {}, [
        el('td', { class: 'mid', 'data-label': '' }, [
          (p.status === 'pending' && canWrite()) ? cb : el('span', { class: 'tiny muted', text: '—' })
        ]),
        el('td', { 'data-label': 'เลขอ้างอิง' }, [
          el('div', { class: 'mono bold', style: 'font-size:1.05rem', text: p.ref_code }),
          p.receipt_no ? el('div', { class: 'tiny muted', text: 'ใบเสร็จ ' + p.receipt_no }) : null
        ]),
        el('td', { 'data-label': 'สมาชิก' }, [
          el('div', { class: 'bold', text: p.full_name }),
          el('div', { class: 'tiny muted' }, [
            el('span', { class: 'mono', text: p.member_code }),
            p.group_name ? el('span', { text: ' • ' + p.group_name }) : null
          ])
        ]),
        el('td', { 'data-label': 'รายการจัดเก็บ', class: 'small', text: p.collection_name }),
        el('td', { class: 'num bold', 'data-label': 'จำนวนเงิน', text: money(p.amount) }),
        el('td', { 'data-label': 'วันที่แจ้ง', class: 'small' }, [
          el('div', { text: thaiDate(p.created_at, { short: true, withTime: true }) }),
          el('div', { class: 'tiny muted', text: relativeTime(p.created_at) })
        ]),
        el('td', { class: 'mid', 'data-label': 'สถานะ' }, [
          el('span', { class: 'badge badge-' + (p.status === 'approved' ? 'paid' : p.status === 'rejected' ? 'rejected' : p.status === 'cancelled' ? 'cancelled' : 'pending'), text: p.status_label }),
          p.reject_reason ? el('div', { class: 'tiny', style: 'color:var(--red-600)', text: p.reject_reason }) : null
        ]),
        el('td', { class: 'mid cell-full', 'data-label': '' }, [
          el('button', { class: 'btn btn-sm btn-primary', type: 'button',
            text: p.status === 'pending' ? '🔍 ตรวจสอบ' : 'ดูรายละเอียด',
            onclick: function () { navigate('payments', { id: p.id }); } })
        ])
      ]));
    });

    list.appendChild(el('div', { class: 'table-wrap' }, [
      el('table', { class: 'data cards' }, [
        el('thead', {}, [el('tr', {}, [
          el('th', { class: 'mid', style: 'width:40px' }),
          el('th', { text: 'เลขอ้างอิง' }), el('th', { text: 'สมาชิก' }),
          el('th', { text: 'รายการจัดเก็บ' }), el('th', { class: 'num', text: 'จำนวนเงิน' }),
          el('th', { text: 'วันที่แจ้ง' }), el('th', { class: 'mid', text: 'สถานะ' }),
          el('th', { class: 'mid', style: 'width:130px' })
        ])]),
        tbody
      ])
    ]));

    var pg = pager(data, function (p) { payFilters.page = p; loadPayments(); });
    if (pg) list.appendChild(pg);
  });
}

function renderPayFilters(collections, groups, counts) {
  var box = $('#payFilters');
  if (!box) return;
  box.innerHTML = '';

  function tab(val, label, count) {
    return el('button', {
      class: 'tab' + (payFilters.status === val ? ' active' : ''), type: 'button',
      onclick: function () { payFilters.status = val; payFilters.page = 1; loadPayments(); }
    }, [label, count !== undefined ? el('span', { class: 'chip', style: 'margin-inline-start:.35rem', text: String(count) }) : null]);
  }

  box.appendChild(el('div', { class: 'tabs', style: 'margin:0;padding:0 1.1rem' }, [
    tab('pending', 'รอตรวจสอบ', counts.pending),
    tab('approved', 'ชำระแล้ว', counts.approved),
    tab('rejected', 'ไม่ผ่าน', counts.rejected),
    tab('', 'ทั้งหมด')
  ]));

  box.appendChild(el('div', { class: 'filters' }, [
    el('div', { class: 'field' }, [
      el('label', { text: 'ค้นหา' }),
      el('input', { type: 'search', placeholder: 'เลขอ้างอิง / ชื่อ / รหัสสมาชิก', value: payFilters.q,
        oninput: debounce(function (e) { payFilters.q = e.target.value; payFilters.page = 1; loadPayments(); }, 350) })
    ]),
    el('div', { class: 'field' }, [
      el('label', { text: 'รายการจัดเก็บ' }),
      el('select', { onchange: function (e) { payFilters.collection = e.target.value; payFilters.page = 1; loadPayments(); } },
        [el('option', { value: '', text: 'ทุกรายการ' })].concat(collections.map(function (c) {
          return el('option', { value: String(c.id), text: c.name, selected: String(c.id) === payFilters.collection });
        })))
    ]),
    el('div', { class: 'field' }, [
      el('label', { text: 'กลุ่ม/ชั้น' }),
      el('select', { onchange: function (e) { payFilters.group = e.target.value; payFilters.page = 1; loadPayments(); } },
        [el('option', { value: '', text: 'ทุกกลุ่ม' })].concat(groups.map(function (g) {
          return el('option', { value: String(g.id), text: g.name, selected: String(g.id) === payFilters.group });
        })))
    ])
  ]));
}

function renderPaymentDetail(view, id) {
  return call('apiPayment', { id: id }).then(function (d) {
    var p = d.payment;
    var a = d.assignment;
    view.innerHTML = '';
    view.appendChild(pageHead('ตรวจสอบการชำระเงิน — ' + p.ref_code, p.full_name + ' • ' + p.collection_name, [
      el('button', { class: 'btn btn-sm', type: 'button', text: '← กลับรายการ', onclick: function () { navigate('payments'); } })
    ]));

    if (d.duplicates.length) {
      view.appendChild(el('div', { class: 'alert alert-warn', style: 'margin-bottom:1rem' }, [
        el('div', {}, [
          el('strong', { text: '⚠ พบสลิปนี้ถูกใช้ซ้ำ! ' }),
          'ไฟล์สลิปเดียวกันนี้ถูกใช้แจ้งชำระอีก ' + d.duplicates.length + ' ครั้ง: ' +
          d.duplicates.map(function (x) { return x.ref_code + ' (' + x.member_code + ')'; }).join(', ') +
          ' — กรุณาตรวจสอบอย่างละเอียดก่อนอนุมัติ'
        ])
      ]));
    }

    var slipBox = el('div', { id: 'slipArea' });
    var slipCard = el('section', { class: 'card' }, [
      el('div', { class: 'row-between', style: 'margin-bottom:.6rem' }, [
        el('h2', { style: 'font-size:1.05rem;margin:0', text: 'สลิปการโอนเงิน' })
      ]),
      slipBox
    ]);

    if (p.has_slip) {
      slipBox.appendChild(el('div', { class: 'loading', style: 'padding:2rem' }, [el('span', { class: 'spinner' }), ' กำลังโหลดสลิป...']));
      call('apiPaymentSlip', { id: p.id }).then(function (f) {
        slipBox.innerHTML = '';
        if (f.mime === 'application/pdf') {
          slipBox.appendChild(el('iframe', { src: f.data_url, class: 'slip-frame', style: 'height:70vh', title: 'สลิป PDF' }));
        } else {
          slipBox.appendChild(el('img', { src: f.data_url, class: 'slip-frame', alt: 'สลิป ' + p.ref_code }));
        }
        slipBox.appendChild(el('div', { class: 'row', style: 'gap:.35rem;margin-top:.6rem' }, [
          el('a', { class: 'btn btn-sm grow', href: f.data_url, target: '_blank', rel: 'noopener', text: '🔍 เปิดเต็มจอ' }),
          el('a', { class: 'btn btn-sm grow', href: f.data_url, download: 'slip-' + p.ref_code, text: '⬇ ดาวน์โหลด' })
        ]));
      }).catch(function (e) {
        slipBox.innerHTML = '';
        slipBox.appendChild(el('div', { class: 'alert alert-warn' }, [e.message]));
      });
    } else {
      slipBox.appendChild(emptyState('📎', 'ไม่มีไฟล์สลิป', 'อาจเป็นการบันทึกโดยผู้ดูแลระบบ'));

  var form = el('form', { id: 'apForm' }, [

    el('div', { class: 'field' }, [

    ])

  var btn = el('button', { class: 'btn btn-green', type: 'submit', form: 'apForm', text: '✓ ยืนยันอนุมัติ' });
  var m = modal({ title: 'อนุมัติการชำระเงิน', body: form, size: 'modal-sm',
    footer: [el('button', { class: 'btn', type: 'button', text: 'ยกเลิก', onclick: function () { m.close(); } }), btn] });

function bulkApprove(ids) {
  if (needWrite()) return;
  confirmDialog({
    title: 'อนุมัติหลายรายการ',
    message: 'ต้องการอนุมัติการชำระเงิน ' + ids.length + ' รายการพร้อมกันใช่หรือไม่? ระบบจะออกเลขที่ใบเสร็จให้ทุกรายการ',
    confirmText: 'อนุมัติ ' + ids.length + ' รายการ'
  }).then(function (yes) {
    if (!yes) return;
    call('apiBulkApprove', { ids: ids })
      .then(function (r) {
        toast('อนุมัติสำเร็จ ' + r.approved + ' รายการ' + (r.failed.length ? ' • ไม่สำเร็จ ' + r.failed.length + ' รายการ' : ''),
          r.failed.length ? 'warn' : 'success', 6000);
        if (r.failed.length) {
          modal({ title: 'รายการที่อนุมัติไม่สำเร็จ', size: 'modal-sm',
            body: el('ul', { style: 'margin:0;padding-inline-start:1.2rem' }, r.failed.map(function (f) {
              return el('li', { text: (f.ref_code || '#' + f.id) + ': ' + f.reason });
            })) });
        }
        refreshPending();
        loadPayments();
      })
      .catch(function (e) { toast(e.message, 'error'); });
  });
}

/** พิมพ์เฉพาะส่วนที่ระบุ โดยซ่อนส่วนอื่นชั่วคราว (เว็บแอปอยู่ใน iframe จึงเปิดหน้าต่างใหม่ไม่ได้เสมอไป) */
function printNode(node) {
  var holder = el('div', { id: 'printHolder' });
  holder.appendChild(node.cloneNode(true));
  document.body.appendChild(holder);
  var style = el('style', { id: 'printOnlyStyle', text:
    '@media print { body > *:not(#printHolder) { display: none !important; } ' +
    '#printHolder { display: block !important; } @page { size: A4; margin: 12mm; } }' });
  document.head.appendChild(style);
  window.print();
  setTimeout(function () {
    if (holder.parentNode) holder.parentNode.removeChild(holder);
    if (style.parentNode) style.parentNode.removeChild(style);
  }, 800);
}

function renderAssignRows(d, c) {
  var box = $('#assignList');
  if (!box) return;
  var rows = d.members;

  if (colFilters.group) {
    var gname = null;
    d.groups.forEach(function (g) { if (String(g.id) === colFilters.group) gname = g.name; });
    rows = rows.filter(function (m) { return m.group_name === gname; });
  }
  if (colFilters.status) rows = rows.filter(function (m) { return m.status === colFilters.status; });
  if (colFilters.q) {
    var q = colFilters.q.trim().toLowerCase();
    rows = rows.filter(function (m) {
      return m.full_name.toLowerCase().indexOf(q) >= 0 || String(m.member_code).toLowerCase().indexOf(q) >= 0;
    });
  }

  box.innerHTML = '';
  if (!rows.length) {
    box.appendChild(emptyState('👥', 'ยังไม่มีผู้ที่ต้องชำระ',
      'กด "เพิ่มผู้ต้องชำระ" เพื่อเลือกสมาชิกเป็นรายกลุ่มหรือรายบุคคล พร้อมกำหนดยอดที่ต้องชำระ'));
    return;
  }

  var sumDue = 0, sumPaid = 0, sumOut = 0;
  rows.forEach(function (m) { sumDue += m.waived ? 0 : m.net_due; sumPaid += m.paid_amount; sumOut += m.outstanding; });

  box.appendChild(el('div', { class: 'table-wrap' }, [
    el('table', { class: 'data cards' }, [
      el('thead', {}, [el('tr', {}, [
        el('th', { class: 'mid', style: 'width:55px', text: 'ลำดับ' }),
        el('th', { text: 'รหัส' }), el('th', { text: 'ชื่อ-สกุล' }),

        el('th', { class: 'mid', style: 'width:110px' })
      ])]),
      el('tbody', {}, rows.map(function (m, i) {
        return el('tr', {}, [

          el('td', { class: 'mono', 'data-label': 'รหัส', text: m.member_code }),
          el('td', { 'data-label': 'ชื่อ-สกุล' }, [
            el('button', { class: 'btn btn-ghost bold', style: 'padding:0;color:var(--brand-600)', type: 'button', text: m.full_name, onclick: function () { navigate('members', { id: m.member_id }); } }),

          ]),

function openAssignModal(c, items) {
  if (needWrite()) return;
  Promise.all([call('apiGroups', {}), call('apiAvailableMembers', { collection_id: c.id })]).then(function (res) {
    var groups = res[0].groups.filter(function (g) { return g.member_count > 0; });
    var avail = res[1].members;
    var mode = 'group';
    var selectedMembers = {};

    var modeBox = el('div', { class: 'tabs' }, [
      el('button', { class: 'tab active', type: 'button', dataset: { mode: 'group' }, text: '📁 เลือกทั้งกลุ่ม' }),
      el('button', { class: 'tab', type: 'button', dataset: { mode: 'members' }, text: '👤 เลือกรายบุคคล' }),
      el('button', { class: 'tab', type: 'button', dataset: { mode: 'all' }, text: '🌐 สมาชิกทั้งหมด' })
    ]);

    var paneGroup = el('div', {}, [
      el('div', { class: 'label', text: 'เลือกกลุ่ม/ชั้นเรียนที่ต้องชำระ' }),
      groups.length
        ? el('div', { style: 'max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:.5rem' },
            groups.map(function (g) {
              return el('label', { class: 'check' }, [
                el('input', { type: 'checkbox', class: 'grp-check', value: String(g.id) }),
                el('span', {}, [g.name, el('span', { class: 'muted small', text: ' (' + g.member_count + ' คน)' })])
              ]);
            }))
        : el('div', { class: 'alert alert-warn' }, ['ยังไม่มีกลุ่มที่มีสมาชิก กรุณาเพิ่มสมาชิกก่อน'])
    ]);

    var memberList = el('div', { style: 'max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:.5rem' });
    var countLabel = el('span', { class: 'chip', text: 'เลือกแล้ว 0 คน' });
    function updateCount() { countLabel.textContent = 'เลือกแล้ว ' + Object.keys(selectedMembers).length + ' คน'; }

    function renderAvail(q) {
      memberList.innerHTML = '';
      var rows = q ? avail.filter(function (m) {
        return m.full_name.toLowerCase().indexOf(q.toLowerCase()) >= 0 ||
          String(m.member_code).toLowerCase().indexOf(q.toLowerCase()) >= 0;
      }) : avail;
      if (!rows.length) {
        memberList.appendChild(el('div', { class: 'muted small center', style: 'padding:1rem', text: 'ไม่พบสมาชิกที่ยังไม่อยู่ในรายการนี้' }));
        return;
      }
      rows.slice(0, 400).forEach(function (m) {
        memberList.appendChild(el('label', { class: 'check' }, [
          el('input', { type: 'checkbox', value: String(m.id), checked: !!selectedMembers[m.id], onchange: function (e) {
            if (e.target.checked) selectedMembers[m.id] = true; else delete selectedMembers[m.id];
            updateCount();
          }}),
          el('span', { class: 'small' }, [
            el('span', { class: 'mono', text: m.member_code }), ' ', m.full_name,
            m.group_name ? el('span', { class: 'muted', text: ' • ' + m.group_name }) : null
          ])
        ]));
      });
    }

    var paneMembers = el('div', { class: 'hidden' }, [
      el('div', { class: 'row-between', style: 'margin-bottom:.4rem' }, [
        el('span', { class: 'label', style: 'margin:0', text: 'เลือกสมาชิกรายบุคคล' }), countLabel
      ]),
      el('input', { type: 'search', placeholder: 'ค้นหาชื่อหรือรหัส...', style: 'margin-bottom:.4rem',
        oninput: debounce(function (e) { renderAvail(e.target.value); }, 200) }),
      memberList,
      el('div', { class: 'row', style: 'gap:.35rem;margin-top:.4rem' }, [
        el('button', { class: 'btn btn-sm', type: 'button', text: 'เลือกทั้งหมดที่แสดง', onclick: function () {
          $$('input[type=checkbox]', memberList).forEach(function (cb) { cb.checked = true; selectedMembers[cb.value] = true; });
          updateCount();
        }}),
        el('button', { class: 'btn btn-sm', type: 'button', text: 'ล้างการเลือก', onclick: function () {
          selectedMembers = {};
          $$('input[type=checkbox]', memberList).forEach(function (cb) { cb.checked = false; });
          updateCount();
        }})
      ])
    ]);
    renderAvail('');

    var paneAll = el('div', { class: 'hidden' }, [
      el('div', { class: 'alert alert-warn' }, ['จะเพิ่มสมาชิกที่เปิดใช้งานทั้งหมดเข้ารายการนี้ (ยังไม่อยู่ในรายการ ' + avail.length + ' คน)'])
    ]);

    var amountInput = el('input', { type: 'number', id: 'asAmount', step: '0.01', min: '0', value: String(c.base_amount || c.default_amount || 0) });
    var itemChecks = el('div', {}, items.map(function (it) {
      return el('label', { class: 'check' }, [
        el('input', { type: 'checkbox', class: 'ai-check', value: String(it.id), checked: !it.is_optional,
          dataset: { amount: String(it.amount) }, onchange: calcAmount }),
        el('span', { class: 'small' }, [it.name, el('span', { class: 'muted', text: ' — ' + money(it.amount) + ' บาท' })])
      ]);
    }));
    function calcAmount() {
      if (!items.length) return;
      var total = 0;
      $$('.ai-check', itemChecks).forEach(function (x) { if (x.checked) total += Number(x.dataset.amount); });
      amountInput.value = String(Math.round(total * 100) / 100);
    }

    var form = el('form', { id: 'asForm' }, [
      modeBox, paneGroup, paneMembers, paneAll,
      el('hr', { class: 'divider' }),
      items.length ? el('fieldset', {}, [
        el('legend', { text: 'กิจกรรมย่อยที่ต้องชำระ' }),
        itemChecks,
        el('div', { class: 'hint', text: 'ติ๊กเลือกเฉพาะกิจกรรมที่กลุ่ม/บุคคลนี้ต้องชำระ ยอดรวมจะคำนวณให้อัตโนมัติ' })
      ]) : null,
      el('div', { class: 'grid grid-2', style: 'gap:.7rem' }, [
        el('div', { class: 'field', style: 'margin:0' }, [el('label', { class: 'req', for: 'asAmount', text: 'ยอดที่ต้องชำระต่อคน (บาท)' }), amountInput]),
        el('div', { class: 'field', style: 'margin:0' }, [
          el('label', { for: 'asDiscount', text: 'ส่วนลด (บาท)' }),
          el('input', { type: 'number', id: 'asDiscount', step: '0.01', min: '0', value: '0' })
        ])
      ]),
      el('div', { class: 'field' }, [
        el('label', { for: 'asNote', text: 'หมายเหตุ' }),
        el('input', { type: 'text', id: 'asNote', maxlength: '500' })
      ]),
      el('label', { class: 'check' }, [
        el('input', { type: 'checkbox', id: 'asOverwrite' }),
        el('span', {}, [
          el('span', { class: 'bold', text: 'แก้ไขยอดของผู้ที่อยู่ในรายการอยู่แล้ว' }),
          el('div', { class: 'tiny muted', text: 'ข้ามผู้ที่มีการแจ้งชำระแล้วเสมอ เพื่อไม่ให้กระทบข้อมูลการเงิน' })
        ])
      ])
    ]);

    $$('button.tab', modeBox).forEach(function (t) {
      t.addEventListener('click', function () {
        mode = t.dataset.mode;
        $$('button.tab', modeBox).forEach(function (x) { x.classList.toggle('active', x === t); });
        paneGroup.classList.toggle('hidden', mode !== 'group');
        paneMembers.classList.toggle('hidden', mode !== 'members');
        paneAll.classList.toggle('hidden', mode !== 'all');
      });
    });

    var btn = el('button', { class: 'btn btn-primary', type: 'submit', form: 'asForm', text: 'เพิ่มผู้ที่ต้องชำระ' });
    var m = modal({ title: 'กำหนดผู้ที่ต้องชำระ — ' + c.name, body: form, size: 'modal-lg',
      footer: [el('button', { class: 'btn', type: 'button', text: 'ยกเลิก', onclick: function () { m.close(); } }), btn] });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var payload = {
        collection_id: c.id, mode: mode,
        amount: amountInput.value,
        discount: $('#asDiscount', form).value,
        note: $('#asNote', form).value,
        overwrite: $('#asOverwrite', form).checked,
        item_ids: items.length ? $$('.ai-check', itemChecks).filter(function (x) { return x.checked; }).map(function (x) { return Number(x.value); }) : []
      };
      if (mode === 'group') {
        payload.group_ids = $$('.grp-check', paneGroup).filter(function (x) { return x.checked; }).map(function (x) { return Number(x.value); });
        if (!payload.group_ids.length) { toast('กรุณาเลือกกลุ่มอย่างน้อย 1 กลุ่ม', 'warn'); return; }
      } else if (mode === 'members') {
        payload.member_ids = Object.keys(selectedMembers).map(Number);
        if (!payload.member_ids.length) { toast('กรุณาเลือกสมาชิกอย่างน้อย 1 คน', 'warn'); return; }
      }
      busy(btn, true, 'กำลังบันทึก...');
      call('apiAssign', payload)
        .then(function (r) {
          m.close();
          toast('เพิ่ม ' + r.created + ' คน • แก้ไข ' + r.updated + ' คน • ข้าม ' + r.skipped + ' คน (ยอด ' + money(r.amount) + ' บาท/คน)', 'success', 6000);
          reload();
        })
        .catch(function (ex) { toast(ex.message, 'error', 6000); busy(btn, false); });
    });
  }).catch(function (e) { toast(e.message, 'error'); });
}

    canWrite() ? el('button', { class: 'btn btn-primary btn-sm', type: 'button', text: '+ เพิ่มสมาชิก', onclick: function () { openMemberForm(); } }) : null
  ]));
  view.appendChild(el('section', { class: 'card card-pad-0' }, [
    el('div', { id: 'memFilters' }), el('div', { id: 'memList' })
  ]));
  return loadMembers();
});

function loadMembers() {
  var list = $('#memList');
  if (!list) return Promise.resolve();
  list.innerHTML = '<div class="loading"><span class="spinner"></span> กำลังโหลด...</div>';

  return Promise.all([
    call('apiMembers', { q: memFilters.q, group: memFilters.group, active: memFilters.active, page: memFilters.page, per_page: 50 }),
    call('apiGroups', {})
  ]).then(function (res) {
    var data = res[0];
    var groups = res[1].groups;
    renderMemFilters(groups, data.total);

    list.innerHTML = '';
    if (!data.members.length) {
      list.appendChild(emptyState('👥', 'ไม่พบสมาชิก',
        (memFilters.q || memFilters.group) ? 'ลองปรับตัวกรองการค้นหา' : 'เริ่มต้นด้วยการเพิ่มสมาชิกหรือนำเข้าจากไฟล์ Excel/CSV',
        canWrite() ? el('div', { class: 'row', style: 'justify-content:center;gap:.5rem' }, [
          el('button', { class: 'btn btn-primary', type: 'button', text: '+ เพิ่มสมาชิก', onclick: function () { openMemberForm(); } }),
          el('button', { class: 'btn', type: 'button', text: '📥 นำเข้าไฟล์', onclick: openImportModal })
        ]) : null));
      return;
    }

    var selected = {};
    var bulkBar = el('div', { class: 'hidden', id: 'memBulk', style: 'padding:.7rem 1.1rem;background:var(--brand-50);border-bottom:1px solid var(--brand-200)' });
    list.appendChild(bulkBar);

    function updateBulk() {
      var ids = Object.keys(selected).map(Number);
      if (!ids.length) { bulkBar.className = 'hidden'; return; }
      bulkBar.className = 'row-between';
      bulkBar.innerHTML = '';
      bulkBar.appendChild(el('span', { class: 'bold small', text: 'เลือกไว้ ' + ids.length + ' คน' }));
      bulkBar.appendChild(el('div', { class: 'row', style: 'gap:.35rem' }, [
        el('button', { class: 'btn btn-sm', type: 'button', text: '🔑 รีเซ็ตรหัส', onclick: function () { bulkResetPin(ids); } }),
        el('button', { class: 'btn btn-sm', type: 'button', text: '🏷️ ย้ายกลุ่ม', onclick: function () { bulkMoveGroup(ids, groups); } }),
        el('button', { class: 'btn btn-sm', type: 'button', text: '⏸ ปิดใช้งาน', onclick: function () { bulkStatus(ids, false); } }),
        el('button', { class: 'btn btn-sm', type: 'button', text: '▶ เปิดใช้งาน', onclick: function () { bulkStatus(ids, true); } }),
        el('button', { class: 'btn btn-sm btn-red', type: 'button', text: '🗑 ลบ', onclick: function () { bulkDelete(ids); } }),
        el('button', { class: 'btn btn-sm btn-ghost', type: 'button', text: 'ยกเลิก', onclick: function () {
          selected = {};
          $$('.row-check', list).forEach(function (cb) { cb.checked = false; cb.closest('tr').classList.remove('is-selected'); });
          updateBulk();
        }})
      ]));
    }

    var headCheck = el('input', { type: 'checkbox', class: 'row-check', onchange: function (e) {
      $$('.row-check', list).forEach(function (cb) {
        if (cb === e.target) return;
        cb.checked = e.target.checked;
        if (e.target.checked) selected[cb.value] = true; else delete selected[cb.value];
        cb.closest('tr').classList.toggle('is-selected', e.target.checked);
      });
      updateBulk();
    }});

    list.appendChild(el('div', { class: 'table-wrap' }, [
      el('table', { class: 'data cards' }, [
        el('thead', {}, [el('tr', {}, [
          el('th', { class: 'mid', style: 'width:40px' }, [canWrite() ? headCheck : null]),
          el('th', { text: 'รหัส' }), el('th', { text: 'ชื่อ-สกุล' }),
          el('th', { class: 'mid', text: 'กลุ่ม/ชั้น' }), el('th', { text: 'ติดต่อ' }),
          data.show_pin ? el('th', { class: 'mid', text: 'รหัส PIN' }) : null,
          el('th', { class: 'mid', text: 'สถานะ' }), el('th', { class: 'mid', style: 'width:130px' })
        ])]),
        el('tbody', {}, data.members.map(function (m) {
          var cb = el('input', { type: 'checkbox', class: 'row-check', value: String(m.id), onchange: function (e) {
            if (e.target.checked) selected[m.id] = true; else delete selected[m.id];
            e.target.closest('tr').classList.toggle('is-selected', e.target.checked);
            updateBulk();
          }});
          return el('tr', {}, [
            el('td', { class: 'mid', 'data-label': '' }, [canWrite() ? cb : null]),
            el('td', { class: 'mono', 'data-label': 'รหัส', text: m.member_code }),
            el('td', { 'data-label': 'ชื่อ-สกุล' }, [
              el('button', { class: 'btn btn-ghost bold', style: 'padding:0;color:var(--brand-600)', type: 'button', text: m.full_name, onclick: function () { navigate('members', { id: m.id }); } }),
              m.assignment_count ? el('div', { class: 'tiny muted', text: 'อยู่ใน ' + m.assignment_count + ' รายการจัดเก็บ' }) : null
            ]),
            el('td', { class: 'mid small', 'data-label': 'กลุ่ม/ชั้น', text: m.group_name || '-' }),
            el('td', { class: 'small', 'data-label': 'ติดต่อ' }, [
              m.phone ? el('div', { class: 'mono', text: m.phone }) : null,
              m.email ? el('div', { class: 'tiny muted', text: m.email }) : null,
              (!m.phone && !m.email) ? el('span', { class: 'muted', text: '-' }) : null
            ]),
            data.show_pin ? el('td', { class: 'mid mono', 'data-label': 'รหัส PIN' }, [
              m.pin_plain
                ? el('button', { class: 'btn btn-sm', type: 'button', text: m.pin_plain, title: 'คลิกเพื่อคัดลอก', onclick: function () {
                    copyText(m.pin_plain).then(function (ok) { toast(ok ? 'คัดลอก ' + m.pin_plain + ' แล้ว' : 'คัดลอกไม่สำเร็จ', ok ? 'success' : 'warn'); });
                  }})
                : el('span', { class: 'muted tiny', text: 'ไม่แสดง' })
            ]) : null,
            el('td', { class: 'mid', 'data-label': 'สถานะ' }, [
              el('span', { class: 'badge ' + (m.is_active ? 'badge-open' : 'badge-closed'), text: m.is_active ? 'ใช้งาน' : 'ปิดใช้งาน' })
            ]),
            el('td', { class: 'mid cell-full', 'data-label': '' }, [
              canWrite() ? el('div', { class: 'row', style: 'gap:.25rem;justify-content:center' }, [
                el('button', { class: 'btn btn-sm', type: 'button', text: '✎', title: 'แก้ไข', onclick: function () { openMemberForm(m); } }),
                el('button', { class: 'btn btn-sm', type: 'button', text: '🔑', title: 'รีเซ็ตรหัส', onclick: function () { resetPin(m); } }),
                el('button', { class: 'btn btn-sm btn-red', type: 'button', text: '🗑', title: 'ลบ', onclick: function () { bulkDelete([m.id]); } })
              ]) : el('button', { class: 'btn btn-sm', type: 'button', text: 'ดู', onclick: function () { navigate('members', { id: m.id }); } })
            ])
          ]);
        }))
      ])
    ]));

    var pg = pager(data, function (p) { memFilters.page = p; loadMembers(); });
    if (pg) list.appendChild(pg);
  });
}

function renderMemFilters(groups, total) {
  var box = $('#memFilters');
  if (!box) return;
  box.innerHTML = '';
  box.appendChild(el('div', { class: 'filters' }, [
    el('div', { class: 'field' }, [
      el('label', { text: 'ค้นหา (ทั้งหมด ' + total + ' คน)' }),
      el('input', { type: 'search', placeholder: 'ชื่อ รหัส หรือเบอร์โทร', value: memFilters.q,
        oninput: debounce(function (e) { memFilters.q = e.target.value; memFilters.page = 1; loadMembers(); }, 350) })
    ]),
    el('div', { class: 'field' }, [
      el('label', { text: 'กลุ่ม/ชั้น' }),
      el('select', { onchange: function (e) { memFilters.group = e.target.value; memFilters.page = 1; loadMembers(); } },
        [el('option', { value: '', text: 'ทุกกลุ่ม' })].concat(groups.map(function (g) {
          return el('option', { value: String(g.id), text: g.name + ' (' + g.member_count + ')', selected: String(g.id) === memFilters.group });
        })))
    ]),
    el('div', { class: 'field' }, [
      el('label', { text: 'สถานะ' }),
      el('select', { onchange: function (e) { memFilters.active = e.target.value; memFilters.page = 1; loadMembers(); } }, [
        el('option', { value: '', text: 'ทั้งหมด' }),
        el('option', { value: '1', text: 'ใช้งาน', selected: memFilters.active === '1' }),
        el('option', { value: '0', text: 'ปิดใช้งาน', selected: memFilters.active === '0' })
      ])
    ])
  ]));
}

function openMemberForm(m) {
  if (needWrite()) return;
  call('apiGroups', {}).then(function (r) {
    var groups = r.groups;
    var isEdit = !!m;
    var form = el('form', { id: 'mForm', autocomplete: 'off' }, [
      el('div', { class: 'grid grid-2', style: 'gap:.7rem' }, [
        el('div', { class: 'field', style: 'margin:0' }, [
          el('label', { for: 'mCode', text: 'รหัสสมาชิก' }),
          el('input', { type: 'text', id: 'mCode', maxlength: '40', value: m ? m.member_code : '', placeholder: 'เว้นว่างเพื่อสร้างอัตโนมัติ' })
        ]),
        el('div', { class: 'field', style: 'margin:0' }, [
          el('label', { for: 'mGroup', text: 'กลุ่ม/ชั้นเรียน' }),
          el('select', { id: 'mGroup' }, [el('option', { value: '', text: '— ไม่ระบุ —' })].concat(
            groups.map(function (g) { return el('option', { value: String(g.id), text: g.name, selected: m && m.group_id === g.id }); })))
        ])
      ]),
      el('div', { class: 'grid grid-3', style: 'gap:.7rem' }, [
        el('div', { class: 'field', style: 'margin:0' }, [
          el('label', { for: 'mPrefix', text: 'คำนำหน้า' }),
          el('input', { type: 'text', id: 'mPrefix', list: 'prefixList', maxlength: '40', value: m ? (m.prefix || '') : '' }),
          el('datalist', { id: 'prefixList' }, ['เด็กชาย', 'เด็กหญิง', 'นาย', 'นาง', 'นางสาว'].map(function (p) { return el('option', { value: p }); }))
        ]),
        el('div', { class: 'field', style: 'margin:0' }, [
          el('label', { class: 'req', for: 'mFirst', text: 'ชื่อ' }),
          el('input', { type: 'text', id: 'mFirst', required: true, maxlength: '120', value: m ? m.first_name : '' })
        ]),
        el('div', { class: 'field', style: 'margin:0' }, [
          el('label', { class: 'req', for: 'mLast', text: 'นามสกุล' }),
          el('input', { type: 'text', id: 'mLast', required: true, maxlength: '120', value: m ? m.last_name : '' })
        ])
      ]),
      el('div', { class: 'grid grid-2', style: 'gap:.7rem' }, [
        el('div', { class: 'field', style: 'margin:0' }, [
          el('label', { for: 'mPhone', text: 'เบอร์โทรศัพท์' }),
          el('input', { type: 'tel', id: 'mPhone', maxlength: '40', value: m ? (m.phone || '') : '' })
        ]),
        el('div', { class: 'field', style: 'margin:0' }, [
          el('label', { for: 'mEmail', text: 'อีเมล' }),
          el('input', { type: 'email', id: 'mEmail', maxlength: '160', value: m ? (m.email || '') : '' })
        ])
      ]),
      el('div', { class: 'field' }, [
        el('label', { for: 'mGuardian', text: 'ชื่อผู้ปกครอง' }),
        el('input', { type: 'text', id: 'mGuardian', maxlength: '160', value: m ? (m.guardian || '') : '' })
      ]),
      el('div', { class: 'field' }, [
        el('label', { for: 'mNote', text: 'หมายเหตุ' }),
        el('input', { type: 'text', id: 'mNote', maxlength: '500', value: m ? (m.note || '') : '' })
      ]),
      isEdit
        ? el('label', { class: 'check' }, [el('input', { type: 'checkbox', id: 'mActive', checked: !!m.is_active }), el('span', { text: 'เปิดใช้งาน' })])
        : el('div', { class: 'alert alert-info small' }, ['ระบบจะสร้างรหัส PIN 6 หลักให้อัตโนมัติ และแสดงให้ทราบหลังบันทึก'])
    ]);

    var btn = el('button', { class: 'btn btn-primary', type: 'submit', form: 'mForm', text: isEdit ? 'บันทึก' : 'เพิ่มสมาชิก' });
    var mo = modal({ title: isEdit ? 'แก้ไขสมาชิก — ' + m.full_name : 'เพิ่มสมาชิกใหม่', body: form,
      footer: [el('button', { class: 'btn', type: 'button', text: 'ยกเลิก', onclick: function () { mo.close(); } }), btn] });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      busy(btn, true, 'กำลังบันทึก...');
      var payload = {
        id: m ? m.id : null,
        member_code: $('#mCode', form).value, prefix: $('#mPrefix', form).value,
        first_name: $('#mFirst', form).value, last_name: $('#mLast', form).value,
        group_id: $('#mGroup', form).value, phone: $('#mPhone', form).value,
        email: $('#mEmail', form).value, guardian: $('#mGuardian', form).value, note: $('#mNote', form).value
      };
      if (isEdit) payload.is_active = $('#mActive', form).checked;
      call('apiSaveMember', payload)
        .then(function (r) {
          mo.close();
          if (!isEdit && r.pin) showCredentials([{ member_code: r.member_code, full_name: r.full_name, pin: r.pin, group: '' }]);
          else toast('บันทึกเรียบร้อย', 'success');
          loadMembers();
        })
        .catch(function (ex) { toast(ex.message, 'error', 6000); busy(btn, false); });
    });
  }).catch(function (e) { toast(e.message, 'error'); });
}

/* ------------------------------ นำเข้าสมาชิก ------------------------------ */
function openImportModal() {
  if (needWrite()) return;
  var parsedRows = null;

  var form = el('form', { id: 'impForm' }, [
    el('div', { class: 'alert alert-info', style: 'margin-bottom:1rem' }, [
      el('div', {}, [
        el('strong', { text: 'รองรับไฟล์ CSV และการคัดลอกวางจาก Excel ' }),
        el('div', { class: 'small', style: 'margin-top:.3rem' }, [
          'หัวคอลัมน์ที่ระบบรู้จัก: รหัสสมาชิก, คำนำหน้า, ชื่อ, นามสกุล (หรือ "ชื่อ-สกุล" รวมกัน), กลุ่ม, เบอร์โทร, อีเมล, ผู้ปกครอง, หมายเหตุ'
        ])
      ])
    ]),
    el('div', { class: 'row', style: 'gap:.4rem;margin-bottom:1rem' }, [
      el('button', { class: 'btn btn-sm grow', type: 'button', text: '⬇ ดาวน์โหลดไฟล์ต้นแบบ CSV', onclick: downloadTemplate })
    ]),
    el('div', { class: 'tabs' }, [
      el('button', { class: 'tab active', type: 'button', dataset: { pane: 'file' }, text: '📁 เลือกไฟล์ CSV' }),
      el('button', { class: 'tab', type: 'button', dataset: { pane: 'paste' }, text: '📋 คัดลอกวางจาก Excel' })
    ]),
    el('div', { id: 'paneFile' }, [
      el('div', { class: 'field' }, [
        el('label', { class: 'req', for: 'impFile', text: 'เลือกไฟล์ CSV' }),
        el('input', { type: 'file', id: 'impFile', accept: '.csv,text/csv,text/plain' }),
        el('div', { class: 'hint', text: 'บันทึกจาก Excel ด้วยรูปแบบ "CSV UTF-8 (Comma delimited)" เพื่อให้ภาษาไทยถูกต้อง' })
      ])
    ]),
    el('div', { id: 'panePaste', class: 'hidden' }, [
      el('div', { class: 'field' }, [
        el('label', { for: 'impPaste', text: 'วางข้อมูลจาก Excel (เลือกทั้งตารางรวมหัวตาราง แล้วคัดลอกมาวาง)' }),
        el('textarea', { id: 'impPaste', rows: '8', placeholder: 'รหัสสมาชิก\tคำนำหน้า\tชื่อ\tนามสกุล\tกลุ่ม\n\tเด็กชาย\tสมชาย\tใจดี\tม.1/1' })
      ])
    ]),
    el('label', { class: 'check' }, [
      el('input', { type: 'checkbox', id: 'impUpdate' }),
      el('span', {}, [
        el('span', { class: 'bold', text: 'อัปเดตข้อมูลของสมาชิกที่มีอยู่แล้ว' }),
        el('div', { class: 'tiny muted', text: 'ถ้าไม่ติ๊ก ระบบจะข้ามรายชื่อที่ซ้ำ' })
      ])
    ]),
    el('div', { id: 'impResult', style: 'margin-top:1rem' })
  ]);

  $$('button.tab', form).forEach(function (t) {
    t.addEventListener('click', function () {
      $$('button.tab', form).forEach(function (x) { x.classList.toggle('active', x === t); });
      $('#paneFile', form).classList.toggle('hidden', t.dataset.pane !== 'file');
      $('#panePaste', form).classList.toggle('hidden', t.dataset.pane !== 'paste');
    });
  });

  var previewBtn = el('button', { class: 'btn', type: 'button', text: '👁 ตรวจสอบก่อนนำเข้า' });
  var importBtn = el('button', { class: 'btn btn-primary', type: 'submit', form: 'impForm', text: '📥 นำเข้าข้อมูล' });
  var mo = modal({ title: 'นำเข้าสมาชิกจากไฟล์', body: form, size: 'modal-lg',
    footer: [el('button', { class: 'btn', type: 'button', text: 'ปิด', onclick: function () { mo.close(); } }), previewBtn, importBtn] });

  function collectRows() {
    return new Promise(function (resolve, reject) {
      var pasteVal = $('#impPaste', form).value;
      if (pasteVal && pasteVal.trim()) {
        resolve(parseDelimited(pasteVal));
        return;
      }
      var file = $('#impFile', form).files[0];
      if (!file) { reject(new Error('กรุณาเลือกไฟล์ หรือวางข้อมูลจาก Excel')); return; }
      var reader = new FileReader();
      reader.onload = function () { resolve(parseDelimited(String(reader.result || ''))); };
      reader.onerror = function () { reject(new Error('อ่านไฟล์ไม่สำเร็จ')); };
      reader.readAsText(file, 'UTF-8');
    });
  }

  function doImport(dryRun) {
    var btn = dryRun ? previewBtn : importBtn;
    busy(btn, true, dryRun ? 'กำลังตรวจสอบ...' : 'กำลังนำเข้า...');
    collectRows().then(function (rows) {
      if (!rows.length) throw new Error('ไม่พบข้อมูลในไฟล์');
      parsedRows = rows;
      return call('apiImportMembers', { rows: rows, dry_run: dryRun, update_existing: $('#impUpdate', form).checked });
    }).then(function (r) {
      renderImportResult(r, dryRun);
      if (!dryRun) {
        toast('นำเข้าสำเร็จ: เพิ่ม ' + r.created + ' คน, อัปเดต ' + r.updated + ' คน', 'success', 6000);
        loadMembers();
        if (r.credentials && r.credentials.length) {
          setTimeout(function () { mo.close(); showCredentials(r.credentials); }, 900);
        }
      }
    }).catch(function (ex) {
      var box = $('#impResult', form);
      box.innerHTML = '';
      box.appendChild(el('div', { class: 'alert alert-error' }, [ex.message]));
    }).then(function () { busy(btn, false); });
  }

  function renderImportResult(r, dryRun) {
    var box = $('#impResult', form);
    box.innerHTML = '';
    box.appendChild(el('div', { class: 'alert ' + (r.errors.length ? 'alert-warn' : 'alert-success') }, [
      el('div', {}, [
        el('strong', { text: dryRun ? 'ผลการตรวจสอบ (ยังไม่บันทึก): ' : 'ผลการนำเข้า: ' }),
        'อ่านได้ ' + r.total_rows + ' แถว • เพิ่มใหม่ ' + r.created + ' • อัปเดต ' + r.updated + ' • ข้าม ' + r.skipped,
        r.errors.length ? el('div', { class: 'small', style: 'margin-top:.3rem' }, ['มีข้อผิดพลาด ' + r.errors.length + ' แถว']) : null
      ])
    ]));
    if (r.errors.length) {
      box.appendChild(el('details', { style: 'margin-top:.5rem' }, [
        el('summary', { style: 'cursor:pointer;font-weight:700', text: 'ดูข้อผิดพลาด (' + r.errors.length + ')' }),
        el('ul', { class: 'small', style: 'margin:.4rem 0;padding-inline-start:1.2rem;max-height:160px;overflow-y:auto' },
          r.errors.slice(0, 80).map(function (x) { return el('li', { text: 'บรรทัดที่ ' + x.line + ': ' + x.message }); }))
      ]));
    }
    if (r.preview && r.preview.length) {
      box.appendChild(el('div', { class: 'table-wrap', style: 'max-height:280px;overflow-y:auto;margin-top:.5rem' }, [
        el('table', { class: 'data' }, [
          el('thead', {}, [el('tr', {}, [
            el('th', { text: 'บรรทัด' }), el('th', { text: 'การทำงาน' }),
            el('th', { text: 'รหัส' }), el('th', { text: 'ชื่อ-สกุล' }), el('th', { text: 'กลุ่ม' })
          ])]),
          el('tbody', {}, r.preview.slice(0, 200).map(function (x) {

/** แยกข้อความเป็นตาราง รองรับทั้ง CSV (คั่นด้วย ,) และการคัดลอกจาก Excel (คั่นด้วย Tab) */
function parseDelimited(text) {
  text = String(text).replace(/^﻿/, '');
  var firstLine = text.split(/\r?\n/)[0] || '';
  var delim = (firstLine.indexOf('\t') >= 0) ? '\t' : ',';
  var rows = [];
  var row = [], field = '', inQ = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    if (inQ) {
      if (ch === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (ch === '\r') { /* ข้าม */ }
    else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) {
    for (var k = 0; k < r.length; k++) if (String(r[k]).trim()) return true;
    return false;
  });
}

  ];
  var csv = '﻿' + rows.map(function (r) {

function downloadText(content, filename, mime) {
  try {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    a.parentNode.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  } catch (e) {
    toast('ดาวน์โหลดไม่สำเร็จในเบราว์เซอร์นี้', 'error');
  }
}

    var collections = pre[0].collections.filter(function (c) { return c.status !== 'draft'; });
    var groups = pre[1].groups;
    var members = pre[2] ? pre[2].members : [];

    if (kind === 'collection' && (!f.collection || !collections.some(function (c) { return String(c.id) === String(f.collection); }))) {
      f.collection = collections.length ? String(collections[0].id) : '';
    }
    if (kind === 'member' && !f.member && members.length) f.member = String(members[0].id);

    if (kind === 'collection' && !f.collection) {
      box.innerHTML = '';
      box.appendChild(el('div', { class: 'card' }, [emptyState('📋', 'ยังไม่มีรายการจัดเก็บที่เปิดใช้งาน')]));
      return;
    }
    if (kind === 'member' && !f.member) {
      box.innerHTML = '';
      box.appendChild(el('div', { class: 'card' }, [emptyState('👤', 'ยังไม่มีสมาชิกในระบบ')]));
      return;
    }

    var params = { kind: kind };
    ['collection', 'member', 'group', 'from', 'to', 'status', 'status_filter'].forEach(function (k) {
      if (f[k]) params[k] = f[k];
    });

    return call('apiReport', params).then(function (d) {
      box.innerHTML = '';
      box.appendChild(buildFilterBar(kind, collections, groups, members));
      if (kind === 'overview') drawOverview(box, d);
      else if (kind === 'collection') drawCollectionReport(box, d);
      else if (kind === 'members') drawAllMembers(box, d);
      else if (kind === 'member') drawMemberReport(box, d);
      else if (kind === 'transactions') drawTransactions(box, d);
      else drawOutstanding(box, d);
    });
  }).catch(function (e) {
    box.innerHTML = '';
    box.appendChild(el('div', { class: 'card' }, [el('div', { class: 'alert alert-error' }, [e.message])]));
  });
}

function buildFilterBar(kind, collections, groups, members) {

    ]);
  }
  function dateField(label, key) {
    return el('div', { class: 'field', style: 'margin:0' }, [
      el('label', { text: label }),

  }

        }))
    ]));
    fields.push(selField('กรองสถานะ', 'status_filter',
      [el('option', { value: '', text: 'ทุกสถานะ' })].concat(
        ['unpaid', 'pending', 'paid', 'partial', 'rejected', 'waived'].map(function (s) {
          return el('option', { value: s, text: STATUS_META[s].label, selected: s === f.status_filter });
        }))));

    fields.push(el('div', { class: 'field grow', style: 'margin:0' }, [
      el('label', { text: 'เลือกสมาชิก' }),
      el('select', { onchange: function (e) { f.member = e.target.value; renderReportTab(); } },
        members.map(function (m) {
          return el('option', { value: String(m.id), selected: String(m.id) === String(f.member),
            text: m.member_code + ' — ' + m.full_name + (m.group_name ? ' (' + m.group_name + ')' : '') });
        }))
    ]));
    fields.push(selField('เฉพาะรอบ', 'collection',
      [el('option', { value: '', text: 'ทุกรอบ (รวมทั้งหมด)' })].concat(collections.map(function (c) {
        return el('option', { value: String(c.id), text: c.name, selected: String(c.id) === String(f.collection) });
      })), 180));
  } else if (kind === 'members') {
    fields.push(selField('กลุ่ม/ชั้น', 'group',
      [el('option', { value: '', text: 'ทุกกลุ่ม' })].concat(groups.map(function (g) {
        return el('option', { value: String(g.id), text: g.name, selected: String(g.id) === String(f.group) });
      }))));
    fields.push(selField('เฉพาะรายการจัดเก็บ', 'collection',
      [el('option', { value: '', text: 'ทุกรายการ (รวมทั้งหมด)' })].concat(collections.map(function (c) {
        return el('option', { value: String(c.id), text: c.name, selected: String(c.id) === String(f.collection) });
      })), 180));
    fields.push(dateField('ตั้งแต่วันที่', 'from'));
    fields.push(dateField('ถึงวันที่', 'to'));
  } else if (kind === 'transactions') {
    fields.push(selField('สถานะ', 'status', [
      el('option', { value: 'approved', text: 'อนุมัติแล้ว', selected: f.status === 'approved' }),
      el('option', { value: 'pending', text: 'รอตรวจสอบ', selected: f.status === 'pending' }),
      el('option', { value: 'rejected', text: 'ไม่ผ่าน', selected: f.status === 'rejected' }),
      el('option', { value: 'all', text: 'ทั้งหมด', selected: f.status === 'all' })
    ]));
    fields.push(selField('รายการจัดเก็บ', 'collection',

        return el('option', { value: String(c.id), text: c.name, selected: String(c.id) === String(f.collection) });
      })), 180));
    fields.push(selField('กลุ่ม/ชั้น', 'group',
      [el('option', { value: '', text: 'ทุกกลุ่ม' })].concat(groups.map(function (g) {
        return el('option', { value: String(g.id), text: g.name, selected: String(g.id) === String(f.group) });
      })), 140));
    fields.push(dateField('ตั้งแต่', 'from'));
    fields.push(dateField('ถึง', 'to'));
  } else if (kind === 'outstanding') {
    fields.push(el('div', { class: 'field grow', style: 'margin:0' }, [

      })), 140));

  fields.push(el('div', { class: 'row no-print', style: 'gap:.4rem;align-items:flex-end' }, [

  return el('section', { class: 'card', style: 'margin-bottom:1rem' }, [
    el('div', { class: 'row', style: 'gap:.6rem;align-items:flex-end' }, fields)

}

function reportTable(columns, rows, totals) {
  return el('div', { class: 'table-wrap' }, [
    el('table', { class: 'data' }, [
      el('thead', {}, [el('tr', {}, columns.map(function (c) { return el('th', { class: c.cls || '', text: c.header }); }))]),
      el('tbody', {}, rows.length
        ? rows.map(function (r) {
            return el('tr', {}, columns.map(function (c) {
              if (c.render) return el('td', { class: c.cls || '' }, [c.render(r)]);
              var v = c.fmt ? c.fmt(r[c.key], r) : r[c.key];
              return el('td', { class: c.cls || '', text: (v === null || v === undefined || v === '') ? '-' : String(v) });
            }));
          })
        : [el('tr', {}, [el('td', { colspan: String(columns.length), class: 'center muted', style: 'padding:2rem', text: 'ไม่มีข้อมูลตามเงื่อนไขที่เลือก' })])]),
      totals ? el('tfoot', {}, [el('tr', {}, columns.map(function (c, i) {
        return el('td', { class: c.cls || '', text: i === 0 ? (totals.__label || 'รวมทั้งสิ้น') : (totals[c.key] !== undefined ? money(totals[c.key]) : '') });
      }))]) : null
    ])
  ]);
}

/** ส่งออกรายงานเป็นไฟล์ Google Sheets แล้วแสดงลิงก์ดาวน์โหลด */
function exportReport(kind, params) {
  var m = modal({
    title: 'กำลังสร้างไฟล์รายงาน', size: 'modal-sm',
    body: el('div', { class: 'loading', style: 'padding:2rem' }, [
      el('span', { class: 'spinner' }), ' กำลังสร้างไฟล์ กรุณารอสักครู่...'
    ]),
    closeOnBackdrop: false
  });

  var payload = { kind: kind };
  for (var k in (params || {})) if (Object.prototype.hasOwnProperty.call(params, k)) payload[k] = params[k];

  call('apiExportReport', payload).then(function (r) {
    m.body.innerHTML = '';
    m.body.appendChild(el('div', {}, [
      el('div', { class: 'alert alert-success', style: 'margin-bottom:1rem' }, [
        el('div', {}, [
          el('strong', { text: 'สร้างไฟล์รายงานเรียบร้อย ' }),
          el('div', { class: 'small', style: 'margin-top:.3rem', text: r.name + ' (' + r.row_count + ' แถว)' }),
          el('div', { class: 'tiny muted', style: 'margin-top:.3rem', text: 'ไฟล์ถูกบันทึกไว้ในโฟลเดอร์ "รายงาน" ใน Google Drive ของท่าน' })
        ])
      ]),
      el('div', { class: 'link-row' }, [
        el('button', { class: 'btn btn-primary', type: 'button', text: '📗 เปิดใน Google Sheets', onclick: function () { openUrl(r.url); } }),
        el('button', { class: 'btn btn-green', type: 'button', text: '⬇ Excel (.xlsx)', onclick: function () { openUrl(r.xlsx_url); } }),
        el('button', { class: 'btn', type: 'button', text: '⬇ CSV', onclick: function () { openUrl(r.csv_url); } }),
        el('button', { class: 'btn', type: 'button', text: '⬇ PDF', onclick: function () { openUrl(r.pdf_url); } })
      ])
    ]));
  }).catch(function (e) {
    m.body.innerHTML = '';
    m.body.appendChild(el('div', { class: 'alert alert-error' }, [e.message]));
  });
}

    function runPhoneFix(dryRun) {
      var box = $('#phoneFixResult');

        busy(btn, true, dryRun ? 'กำลังตรวจสอบ...' : 'กำลังดำเนินการ...');

      el('button', { class: 'btn', type: 'button', text: 'ยกเลิก', onclick: function () { m.close(); } }),
      el('button', { class: 'btn btn-primary', type: 'button', text: 'ตั้งรหัสผ่านใหม่', onclick: function (e) {
        busy(e.target, true);
        call('apiResetUserPassword', { id: u.id, password: input.value })
          .then(function (r) {
            m.close();
            if (r.password) showGeneratedPassword(r.username, r.password);
            else toast('ตั้งรหัสผ่านใหม่เรียบร้อย', 'success');
          })
          .catch(function (ex) { toast(ex.message, 'error'); busy(e.target, false); });
      }})
    ]
  });
}

function unlockUser(u) {
  call('apiUnlockUser', { id: u.id })
    .then(function () { toast('ปลดล็อกบัญชีแล้ว', 'success'); reload(); })
    .catch(function (e) { toast(e.message, 'error'); });
}

function deleteUser(u) {
  confirmDialog({ title: 'ลบผู้ดูแลระบบ', danger: true, confirmText: 'ลบ',
    message: 'ต้องการลบบัญชี ' + u.username + ' (' + u.full_name + ') ใช่หรือไม่?' })
    .then(function (yes) {
      if (!yes) return;
      call('apiDeleteUser', { id: u.id })
        .then(function () { toast('ลบบัญชีแล้ว', 'success'); reload(); })
        .catch(function (e) { toast(e.message, 'error'); });
    });
}
